[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sort-analyzer"
version = "0.2.0"
description = "A C/Python hybrid tool to benchmark and analyze sorting algorithms."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib", "typer", "rich"]

[project.scripts]
sort-analyzer = "sort_analyzer.cli:app"

[tool.hatch.build]
sources = ["python/src"]

[tool.hatch.build.targets.wheel]
packages = ["python/src/sort_analyzer"]
